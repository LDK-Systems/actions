# Temporary branch-only bootstrap, removed before merging.
name: Bootstrap reviewed action bundles
on:
  push:
    branches:
      - feat/dotnet-release-check
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'LDK-Systems/actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - run: npm run test:ci-tools
      - run: npm run build
      - name: Archive generated bundles and formatter changes
        run: |
          git diff --binary -- '*.ts' > /tmp/format.patch
          tar -czf /tmp/dist.tar.gz check-release-version/dist extract-dotnet-version/dist generate-release-notes/dist render-template/dist check-dotnet-release/dist
      - uses: actions/upload-artifact@v4
        with:
          name: generated-bundles
          path: |
            /tmp/dist.tar.gz
            /tmp/format.patch
          retention-days: 1
  commit:
    if: github.repository == 'LDK-Systems/actions'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dotnet-release-check
      - uses: actions/download-artifact@v4
        with:
          name: generated-bundles
          path: /tmp/bundles
      - name: Commit only generated bundles and formatting changes
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if test -s /tmp/bundles/format.patch; then
            git apply --index /tmp/bundles/format.patch
          fi
          tar -xzf /tmp/bundles/dist.tar.gz
          git add -f check-release-version/dist extract-dotnet-version/dist generate-release-notes/dist render-template/dist check-dotnet-release/dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'build: commit generated ncc action bundles and format TypeScript'
          git push origin HEAD:refs/heads/feat/dotnet-release-check
