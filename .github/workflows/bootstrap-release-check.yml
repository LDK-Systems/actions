# Temporary branch-only distribution generation; removed before merging.
name: Rebuild reviewed release checker bundles
on:
  push:
    branches: [feat/dotnet-release-check]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'LDK-Systems/actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - run: npm run format
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:ci-tools
      - run: npm run test:coverage
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - name: Package generated files
        run: |
          git diff --binary -- '*.ts' > /tmp/format.patch
          tar -czf /tmp/dist.tar.gz check-release-version/dist check-dotnet-release/dist extract-dotnet-version/dist generate-release-notes/dist render-template/dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-check-bundles
          path: |
            /tmp/dist.tar.gz
            /tmp/format.patch
          retention-days: 1
  commit:
    if: github.repository == 'LDK-Systems/actions'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dotnet-release-check
      - uses: actions/download-artifact@v4
        with:
          name: release-check-bundles
          path: /tmp/bundles
      - name: Commit generated files on the reviewed branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if test -s /tmp/bundles/format.patch; then
            git apply --index /tmp/bundles/format.patch
          fi
          rm -rf check-release-version/dist check-dotnet-release/dist extract-dotnet-version/dist generate-release-notes/dist render-template/dist
          tar -xzf /tmp/bundles/dist.tar.gz
          git add -A -f -- check-release-version/dist check-dotnet-release/dist extract-dotnet-version/dist generate-release-notes/dist render-template/dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'build: regenerate multi-source release checker bundles'
          git push origin HEAD:refs/heads/feat/dotnet-release-check
