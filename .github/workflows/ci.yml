name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm audit --audit-level=moderate

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build and verify committed bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:dist

  dotnet-smoke:
    name: Evaluate MSBuild and query release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - id: lookup
        uses: ./check-dotnet-release
        with:
          project-file: check-dotnet-release/__fixtures__/src/Example.csproj
          configuration: Release
          release-tag-prefix: ci-probe/${{ github.run_id }}/v
      - name: Verify evaluated version and missing release
        env:
          ACTUAL_VERSION: ${{ steps.lookup.outputs.version }}
          ACTUAL_TAG: ${{ steps.lookup.outputs.tag }}
          RELEASE_EXISTS: ${{ steps.lookup.outputs.exists }}
          TAG_EXISTS: ${{ steps.lookup.outputs.tag-exists }}
        run: |
          test "$ACTUAL_VERSION" = '2.4.0-preview.1'
          test "$ACTUAL_TAG" = "ci-probe/$GITHUB_RUN_ID/v2.4.0-preview.1"
          test "$RELEASE_EXISTS" = 'false'
          test "$TAG_EXISTS" = 'false'
