name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Resolve changed JavaScript actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      actions: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: volta-cli/action@v4
      - name: Generate workspace filters
        run: node scripts/resolve-action-filters.mjs > .github/action-filters.generated.json
      - name: Resolve affected actions
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/action-filters.generated.json
          base: ${{ github.event_name == 'push' && github.ref || github.base_ref }}
      - name: Report selected actions
        env:
          ACTIONS: ${{ steps.filter.outputs.changes }}
        run: printf 'Affected actions: %s\n' "$ACTIONS"

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.actions != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - run: npm run lint
      - run: npm run format:check
        if: success() || failure()
      - run: npm run typecheck
        if: success() || failure()
      - run: npm run test:ci-tools
        if: success() || failure()
      - run: npm audit --audit-level=moderate
        if: success() || failure()

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.actions != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - run: npx vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build ${{ matrix.action }}
    needs: changes
    if: needs.changes.outputs.actions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action: ${{ fromJSON(needs.changes.outputs.actions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Clean selected action
        env:
          ACTION: ${{ matrix.action }}
        run: npm run clean:dist -- "$ACTION"
      - name: Build selected action with ncc
        env:
          ACTION: ${{ matrix.action }}
        run: npm run build --workspace "$ACTION"
      - name: Verify committed distribution
        env:
          ACTION: ${{ matrix.action }}
        run: npm run check:dist -- "$ACTION"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.action }}
          path: ${{ matrix.action }}/dist/
          if-no-files-found: error
          retention-days: 7

  dotnet-smoke:
    name: Evaluate MSBuild and query release
    needs: [changes, build]
    if: contains(fromJSON(needs.changes.outputs.actions || '[]'), 'check-dotnet-release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - id: lookup
        uses: ./check-dotnet-release
        with:
          project-file: check-dotnet-release/__fixtures__/src/Example.csproj
          configuration: Release
          release-tag-prefix: ci-probe/${{ github.run_id }}/v
      - name: Verify evaluated version and missing release
        env:
          ACTUAL_VERSION: ${{ steps.lookup.outputs.version }}
          ACTUAL_TAG: ${{ steps.lookup.outputs.tag }}
          RELEASE_EXISTS: ${{ steps.lookup.outputs.exists }}
          TAG_EXISTS: ${{ steps.lookup.outputs.tag-exists }}
        run: |
          test "$ACTUAL_VERSION" = '2.4.0-preview.1'
          test "$ACTUAL_TAG" = "ci-probe/$GITHUB_RUN_ID/v2.4.0-preview.1"
          test "$RELEASE_EXISTS" = 'false'
          test "$TAG_EXISTS" = 'false'

  result:
    name: CI result
    needs: [changes, quality, test, build, dotnet-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to succeed
        env:
          CHANGES: ${{ needs.changes.result }}
          ACTIONS: ${{ needs.changes.outputs.actions }}
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          SMOKE: ${{ needs.dotnet-smoke.result }}
          EXPECT_SMOKE: ${{ contains(fromJSON(needs.changes.outputs.actions || '[]'), 'check-dotnet-release') }}
        run: |
          test "$CHANGES" = success
          if test "$ACTIONS" = '[]'; then
            echo 'No JavaScript actions affected.'
            exit 0
          fi
          test "$QUALITY" = success
          test "$TEST" = success
          test "$BUILD" = success
          if test "$EXPECT_SMOKE" = true; then
            test "$SMOKE" = success
          fi
